---
# ─────────────────────────────────────────────────────────────────────────────
# CAMATIS Ansible Playbook — DevOps CA2
#
# Demonstrates all three required configuration-management areas:
#   1. PACKAGES — installs python3, pip, curl, git
#   2. USER     — creates 'camatis' system user with home directory
#   3. FILES    — creates /opt/camatis directory + runtime-info.txt
#
# Idempotent: running the playbook twice produces no unnecessary changes
# (all Ansible modules used are idempotent by design).
#
# Prerequisites (WSL Ubuntu):
#   sudo apt install ansible        # or: pip install ansible
#
# Syntax check:
#   ansible-playbook -i inventory.ini playbook.yml --syntax-check
#
# Dry run (check mode):
#   ansible-playbook -i inventory.ini playbook.yml --check
#
# First run:
#   ansible-playbook -i inventory.ini playbook.yml
#
# Second run (proves idempotency — all tasks should report 'ok', not 'changed'):
#   ansible-playbook -i inventory.ini playbook.yml
# ─────────────────────────────────────────────────────────────────────────────

- name: CAMATIS Runtime Environment Configuration
  hosts: local
  become: true          # sudo is required for package install, user create, /opt write

  vars:
    # ── Tuneable variables ──────────────────────────────────────────────────
    camatis_user: camatis
    camatis_shell: /bin/bash
    camatis_home: /home/camatis       # explicit home (user is not a nologin system account)
    camatis_dir: /opt/camatis
    camatis_port: 8000
    camatis_env: development
    app_name: CAMATIS

    # Packages to install
    required_packages:
      - python3
      - python3-pip
      - curl
      - git

  # ── 1. PACKAGES ───────────────────────────────────────────────────────────
  tasks:
    - name: "PACKAGES | Update apt cache"
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600      # skip update if cache is < 1 h old (idempotent)
      tags: packages

    - name: "PACKAGES | Install required packages"
      ansible.builtin.apt:
        name: "{{ required_packages }}"
        state: present
      tags: packages

  # ── 2. USER ───────────────────────────────────────────────────────────────
    - name: "USER | Create 'camatis' group"
      ansible.builtin.group:
        name: "{{ camatis_user }}"
        state: present
      tags: user

    - name: "USER | Create 'camatis' system user"
      ansible.builtin.user:
        name: "{{ camatis_user }}"
        group: "{{ camatis_user }}"
        home: "{{ camatis_home }}"
        shell: "{{ camatis_shell }}"
        create_home: true
        comment: "CAMATIS application service account"
        state: present
      tags: user

  # ── 3. FILES ──────────────────────────────────────────────────────────────
    - name: "FILES | Create /opt/camatis directory"
      ansible.builtin.file:
        path: "{{ camatis_dir }}"
        state: directory
        owner: "{{ camatis_user }}"
        group: "{{ camatis_user }}"
        mode: "0755"
      tags: files

    - name: "FILES | Write runtime-info.txt"
      ansible.builtin.copy:
        dest: "{{ camatis_dir }}/runtime-info.txt"
        owner: "{{ camatis_user }}"
        group: "{{ camatis_user }}"
        mode: "0644"
        content: |
          APP_NAME={{ app_name }}
          APP_PORT={{ camatis_port }}
          ENVIRONMENT={{ camatis_env }}
      tags: files

    # ── Verification (informational) ────────────────────────────────────────
    - name: "VERIFY | Confirm runtime-info.txt content"
      ansible.builtin.command:
        cmd: cat {{ camatis_dir }}/runtime-info.txt
      register: runtime_info
      changed_when: false           # read-only — never marks as changed
      tags: verify

    - name: "VERIFY | Display runtime-info.txt"
      ansible.builtin.debug:
        msg: "{{ runtime_info.stdout_lines }}"
      tags: verify

    - name: "VERIFY | Show camatis user info"
      ansible.builtin.command:
        cmd: id {{ camatis_user }}
      register: user_info
      changed_when: false
      tags: verify

    - name: "VERIFY | Display user info"
      ansible.builtin.debug:
        msg: "{{ user_info.stdout }}"
      tags: verify
