---
# ─────────────────────────────────────────────────────────────────────────────
# Grafana — Deployment + Service + ConfigMaps for auto-provisioning
#
# Default credentials (academic demo only — NOT for production use):
#   Username: admin
#   Password: camatis-demo
#
# The dashboard and datasource are auto-provisioned from ConfigMaps, so no
# manual setup is needed after 'kubectl apply'.
# ─────────────────────────────────────────────────────────────────────────────

# ── Grafana admin credentials as a Secret ────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: grafana-credentials
  namespace: camatis
  labels:
    app: grafana
    app.kubernetes.io/part-of: camatis
type: Opaque
stringData:
  admin-user: admin
  admin-password: camatis-demo    # DEMO ONLY — change for any real environment
---
# ── Datasource provisioning ConfigMap ────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: camatis
  labels:
    app: grafana
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
        jsonData:
          httpMethod: POST
          timeInterval: "15s"
---
# ── Dashboard provider provisioning ConfigMap ─────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: camatis
  labels:
    app: grafana
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: CAMATIS Dashboards
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
---
# ── Dashboard JSON ConfigMap ──────────────────────────────────────────────────
# The full dashboard JSON is stored here and mounted into the Grafana pod.
# PromQL queries use EXACT metric names from prometheus-fastapi-instrumentator v7:
#   http_requests_total{job, handler, method, status}
#   http_request_duration_highr_seconds_bucket{job, le}  (high-res histogram)
#   up{job}  (scraped by Prometheus from /metrics endpoint)
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-camatis
  namespace: camatis
  labels:
    app: grafana
data:
  camatis-observability.json: |
    {
      "annotations": { "list": [] },
      "description": "CAMATIS API observability — uptime, request rate, latency, error rate",
      "editable": true,
      "graphTooltip": 1,
      "panels": [
        {
          "datasource": { "type": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [
                { "options": { "0": { "color": "red",   "text": "DOWN" } }, "type": "value" },
                { "options": { "1": { "color": "green", "text": "UP"   } }, "type": "value" }
              ],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 1 }] },
              "unit": "short"
            }
          },
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "id": 1,
          "options": { "colorMode": "background", "graphMode": "none", "justifyMode": "center", "orientation": "auto", "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "textMode": "auto" },
          "title": "API Uptime",
          "description": "1 = UP (Prometheus is successfully scraping /metrics), 0 = DOWN",
          "targets": [{ "expr": "up{job=\"camatis-backend\"}", "legendFormat": "camatis-backend", "refId": "A" }],
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "reqps", "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 10, "showPoints": "never" } } },
          "gridPos": { "h": 8, "w": 9, "x": 6, "y": 0 },
          "id": 2,
          "options": { "legend": { "calcs": ["mean", "max"], "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "title": "Request Rate",
          "description": "HTTP requests per second across all handlers",
          "targets": [
            { "expr": "sum(rate(http_requests_total{job=\"camatis-backend\"}[1m]))", "legendFormat": "total req/s", "refId": "A" },
            { "expr": "sum by (handler) (rate(http_requests_total{job=\"camatis-backend\"}[1m]))", "legendFormat": "{{handler}}", "refId": "B" }
          ],
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "s", "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 10, "showPoints": "never" } } },
          "gridPos": { "h": 8, "w": 9, "x": 15, "y": 0 },
          "id": 3,
          "options": { "legend": { "calcs": ["mean", "max"], "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "title": "P95 Latency",
          "description": "95th-percentile latency via http_request_duration_highr_seconds (high-resolution histogram)",
          "targets": [
            { "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_highr_seconds_bucket{job=\"camatis-backend\"}[5m])) by (le))", "legendFormat": "P95", "refId": "A" },
            { "expr": "histogram_quantile(0.50, sum(rate(http_request_duration_highr_seconds_bucket{job=\"camatis-backend\"}[5m])) by (le))", "legendFormat": "P50 (median)", "refId": "B" }
          ],
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "reqps", "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 20, "showPoints": "never" }, "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "red", "value": 0.01 }] } } },
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 4 },
          "id": 4,
          "options": { "legend": { "calcs": ["mean", "max"], "displayMode": "table", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "title": "HTTP 5xx Error Rate",
          "description": "5xx errors per second. Shows 0 when no errors exist — correct behaviour. Uses 'or vector(0)' to avoid empty panel.",
          "targets": [
            { "expr": "sum(rate(http_requests_total{job=\"camatis-backend\",status=~\"5..\"}[1m])) or vector(0)", "legendFormat": "5xx/s", "refId": "A" }
          ],
          "type": "timeseries"
        }
      ],
      "refresh": "15s",
      "schemaVersion": 39,
      "tags": ["camatis", "devops"],
      "templating": { "list": [] },
      "time": { "from": "now-1h", "to": "now" },
      "timezone": "browser",
      "title": "CAMATIS Observability",
      "uid": "camatis-observability",
      "version": 1
    }
---
# ── Grafana Deployment ────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: camatis
  labels:
    app: grafana
    app.kubernetes.io/part-of: camatis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.4.0
          ports:
            - containerPort: 3000
              name: web
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-credentials
                  key: admin-user
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-credentials
                  key: admin-password
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: /var/lib/grafana/dashboards/camatis-observability.json
          volumeMounts:
            - name: grafana-datasource
              mountPath: /etc/grafana/provisioning/datasources
            - name: grafana-dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: grafana-dashboard-camatis
              mountPath: /var/lib/grafana/dashboards
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: grafana-datasource
          configMap:
            name: grafana-datasource
        - name: grafana-dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: grafana-dashboard-camatis
          configMap:
            name: grafana-dashboard-camatis
---
# ── Grafana Service ───────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: camatis
  labels:
    app: grafana
    app.kubernetes.io/part-of: camatis
spec:
  type: ClusterIP
  selector:
    app: grafana
  ports:
    - name: web
      port: 3000
      targetPort: 3000
      protocol: TCP
