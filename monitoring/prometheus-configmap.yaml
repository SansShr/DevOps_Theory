---
# Prometheus scrape configuration
# Scrapes the CAMATIS backend service every 15 seconds
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: camatis
  labels:
    app: prometheus
    app.kubernetes.io/part-of: camatis
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      scrape_timeout: 10s

    scrape_configs:
      # ── CAMATIS Backend ────────────────────────────────────────────────────
      # Uses Kubernetes DNS: camatis-backend.camatis.svc.cluster.local:8000
      # Short form also works inside the same namespace: camatis-backend:8000
      - job_name: camatis-backend
        static_configs:
          - targets:
              - camatis-backend:8000
        metrics_path: /metrics
        scrape_interval: 15s

      # ── Prometheus self-monitoring ─────────────────────────────────────────
      - job_name: prometheus
        static_configs:
          - targets:
              - localhost:9090
